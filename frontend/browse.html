<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wescues — Browse</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
<body>

  <div class="app-shell">
    <header class="navbar">
      <div class="brand">Wescues</div>
      <nav class="navbar-links">
        <a href="browse.html" class="active">Browse</a>
        <a href="shelter-dashboard.html" id="navShelterLink" class="hidden">My dogs</a>
        <a href="admin.html" id="navAdminLink" class="hidden">Moderation</a>
        <a href="index.html" id="navLoginLink">Log in / Sign up</a>
        <a href="account.html" id="navEmail" class="hidden"></a>
      </nav>
    </header>

    <main style="display: flex; gap: 0;">
      <aside class="filter-sidebar">
        <div class="filter-label">Zip code</div>
        <div class="filter-zip">
          <span aria-hidden="true">📍</span>
          <input type="text" id="zipInput" inputmode="numeric" placeholder="Zip code">
        </div>

        <div class="filter-label">Distance</div>
        <div class="filter-static">Within 25 miles</div>

        <div class="filter-label">Size</div>
        <div class="pill-group" id="sizeGroup">
          <button type="button" class="pill-toggle" data-value="small">Small</button>
          <button type="button" class="pill-toggle" data-value="medium">Medium</button>
          <button type="button" class="pill-toggle" data-value="large">Large</button>
        </div>

        <div class="filter-label">Age</div>
        <div class="pill-group" id="ageGroup">
          <button type="button" class="pill-toggle" data-value="puppy">Puppy</button>
          <button type="button" class="pill-toggle" data-value="adult">Adult</button>
          <button type="button" class="pill-toggle" data-value="senior">Senior</button>
        </div>

        <div class="filter-label">Shelter</div>
        <div class="filter-static" id="shelterCount"></div>
      </aside>

      <div style="flex: 1; padding: 1.5rem 2rem;">
        <div class="filters">
          <input type="text" id="breedFilter" placeholder="Search breed, name…">
        </div>

        <p class="result-count">
          <span id="resultCount"></span>
        </p>

        <div id="dogGrid" class="dog-grid"></div>
      </div>
    </main>
  </div>

  <script type="module" src="browse.js"></script>
</body>
</html>
