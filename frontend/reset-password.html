<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wescues — Reset password</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
<body>

  <header class="topbar">
    <div class="brand">🐾 Wescues</div>
  </header>

  <main class="auth-main">
    <section class="card" id="resetCard">
      <h2>Set a new password</h2>
      <form id="resetForm" class="auth-form">
        <label>New password <input type="password" name="password" required minlength="6"></label>
        <button type="submit" class="primary-btn">Update password</button>
      </form>
      <p id="resetMessage" class="auth-message"></p>
    </section>
  </main>

  <script type="module" src="reset-password.js"></script>
</body>
</html>
