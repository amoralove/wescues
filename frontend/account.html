<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wescues — Account</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
<body>

  <div class="app-shell">
    <header class="navbar">
      <div class="brand">Wescues</div>
      <nav class="navbar-links">
        <a href="browse.html">Browse</a>
        <a href="shelter-dashboard.html" id="navShelterLink" class="hidden">My dogs</a>
        <a href="admin.html" id="navAdminLink" class="hidden">Moderation</a>
        <a href="account.html" id="navAccountLink" class="hidden active">Account</a>
        <a href="index.html" id="navLoginLink">Log in / Sign up</a>
        <span id="navEmail" class="hidden"></span>
        <button id="navLogoutBtn" class="link-btn hidden" type="button" style="color: inherit;">Log out</button>
      </nav>
    </header>

    <main class="page-main">
      <p id="statusMessage"></p>

      <div id="accountContent" class="hidden">
        <h3 id="greeting" style="font-size: 1.5rem; margin-bottom: 0.2rem;"></h3>
        <div id="summaryLine" style="font-size: 0.85rem; color: rgba(32,30,29,.6); margin-bottom: 1.5rem;"></div>

        <div class="section-title">Profile</div>
        <form id="profileNameForm" class="panel" style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
          <label for="fullNameInput" style="font-size: 0.85rem; font-weight: 600; color: rgba(32,30,29,.6);">Display name</label>
          <input id="fullNameInput" name="full_name" type="text" required
            style="flex: 1; padding: 0.5rem 0.9rem; border: 1px solid rgba(32, 30, 29, 0.18); border-radius: 999px; font-size: 0.9rem; background: #f9f4ed; font-family: inherit;">
          <button type="submit" class="primary-btn">Save</button>
        </form>
        <p id="profileNameMessage" style="font-size: 0.8rem; color: #b5432c; min-height: 1.2em; margin: 0 0 1.5rem;"></p>

        <div class="section-title">Your applications</div>
        <div id="applicationsList" style="display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 2rem;"></div>

        <div class="section-title">Saved dogs</div>
        <div id="savedGrid" class="dog-grid"></div>
      </div>
    </main>
  </div>

  <script type="module" src="account.js"></script>
</body>
</html>
