<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wescues — Moderation</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
<body>

  <div class="app-shell">
    <header class="navbar">
      <div class="brand">Wescues <span style="font-size: 0.75rem; font-weight: 600; opacity: 0.7; margin-left: 0.4rem;">trust &amp; safety</span></div>
      <nav class="navbar-links">
        <a href="browse.html">Browse</a>
        <a href="index.html" id="navLoginLink">Log in / Sign up</a>
        <span id="navEmail" class="hidden"></span>
        <button id="navLogoutBtn" class="link-btn hidden" type="button" style="color: inherit;">Log out</button>
      </nav>
    </header>

    <main class="page-main">
      <p id="statusMessage"></p>

      <div id="flagsSection" class="hidden">
        <div class="filters">
          <select id="statusFilter">
            <option value="pending" selected>Pending</option>
            <option value="confirmed_duplicate">Confirmed duplicates</option>
            <option value="dismissed">Dismissed</option>
            <option value="">All</option>
          </select>
        </div>

        <div class="queue-header">
          <span>Queue: <strong id="queueCount">0 pending</strong></span>
          <div class="queue-nav">
            <button id="prevFlagBtn" class="secondary-btn" style="padding: 0.4rem 0.9rem;">← Prev</button>
            <button id="nextFlagBtn" class="secondary-btn" style="padding: 0.4rem 0.9rem;">Next →</button>
          </div>
        </div>

        <div id="flagList" class="flag-list"></div>
      </div>
    </main>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
