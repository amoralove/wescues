<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wescues — Moderation</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
<body>

  <header class="topbar">
    <div class="brand">🐾 Wescues — Moderation</div>
    <nav style="display: flex; align-items: center; gap: 1rem;">
      <a href="browse.html" class="session-status" style="color: inherit; text-decoration: underline;">Browse dogs</a>
      <a href="index.html" id="navLoginLink" class="session-status" style="color: inherit; text-decoration: underline;">Log in / Sign up</a>
      <span id="navEmail" class="session-status hidden"></span>
      <button id="navLogoutBtn" class="link-btn hidden" type="button" style="color: inherit;">Log out</button>
    </nav>
  </header>

  <main class="browse-main">
    <p id="statusMessage"></p>

    <div id="flagsSection" class="hidden">
      <div class="filters">
        <select id="statusFilter">
          <option value="pending" selected>Pending</option>
          <option value="confirmed_duplicate">Confirmed duplicates</option>
          <option value="dismissed">Dismissed</option>
          <option value="">All</option>
        </select>
      </div>

      <div class="queue-header">
        <span>Queue: <strong id="queueCount">0 pending</strong></span>
        <div class="queue-nav">
          <button id="prevFlagBtn" class="secondary-btn" style="padding: 0.4rem 0.9rem;">← Prev</button>
          <button id="nextFlagBtn" class="secondary-btn" style="padding: 0.4rem 0.9rem;">Next →</button>
        </div>
      </div>

      <div id="flagList" class="flag-list"></div>
    </div>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
